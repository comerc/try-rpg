<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="icon" href="data:," />
    <title>RTS — Warcraft-style</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        color: #e8e8e8;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      #game canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }
      .orientation-notice {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
        padding: 28px;
        background: #08100f;
        color: #eef7ff;
        text-align: center;
      }
      .orientation-notice strong {
        display: block;
        font-size: 28px;
        line-height: 1.1;
        margin-bottom: 10px;
      }
      .orientation-notice span {
        display: block;
        max-width: 320px;
        color: #b7c8d8;
        font-size: 16px;
        line-height: 1.45;
      }
      @media (orientation: portrait) and (max-width: 760px) {
        .orientation-notice { display: flex; flex-direction: column; }
        #game { visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
